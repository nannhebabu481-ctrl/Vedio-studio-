name: Build and Release Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java version
        run: java -version

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          keytool -genkey -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK existence
        run: |
          if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: app-debug.apk not found!"
            exit 1
          fi
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="v${{ github.run_number }}.${{ github.run_attempt }}"
          RELEASE_TITLE="VideoStudio Debug APK (Build ${{ github.run_number }}.${{ github.run_attempt }})"
          APK_FILE="app/build/outputs/apk/debug/app-debug.apk"
          ASSET_NAME="VideoStudio-debug-build-${{ github.run_number }}-${{ github.run_attempt }}.apk"

          cp "$APK_FILE" "$ASSET_NAME"

          gh release create "$TAG_NAME" "$ASSET_NAME" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes "Debug build generated by GitHub Actions run #${{ github.run_number }} (attempt ${{ github.run_attempt }})." \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="v${{ github.run_number }}.${{ github.run_attempt }}"
          ASSET_NAME="VideoStudio-debug-build-${{ github.run_number }}-${{ github.run_attempt }}.apk"

          if [ "${{ steps.create_release.outcome }}" = "success" ]; then
            echo "=== GitHub Release Published Successfully ==="
            gh release view "$TAG_NAME"
            RELEASE_URL=$(gh release view "$TAG_NAME" --json url -q .url)
            echo "Release Tag: $TAG_NAME"
            echo "Release Title: VideoStudio Debug APK (Build ${{ github.run_number }}.${{ github.run_attempt }})"
            echo "Direct GitHub Release URL: $RELEASE_URL"
            echo "Exact APK Asset Filename: $ASSET_NAME"

            echo "### :rocket: VideoStudio APK Available for Download" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**GitHub Release:** [$TAG_NAME]($RELEASE_URL)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The standalone APK (**$ASSET_NAME**) can be downloaded directly from the **Assets** section of the [Release Page]($RELEASE_URL)." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> :information_source: The workflow Actions artifact (**app-debug-apk**) is also available as a backup download." >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning ::GitHub Release publishing could not be completed or encountered an error."
            echo "APK build succeeded: app/build/outputs/apk/debug/app-debug.apk was generated."
            echo "The Actions artifact named 'app-debug-apk' remains uploaded and available."

            echo "### :warning: GitHub Release Warning" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Release publishing could not be completed, but the **APK build succeeded**." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "You can download the compiled APK from the **Actions artifact** named **app-debug-apk** attached to this workflow run." >> $GITHUB_STEP_SUMMARY
          fi
